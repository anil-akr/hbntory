<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HBntory - Connexion</title>
  <link rel="stylesheet" href="backoffice.css">
  <style>
    body { display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .login-card { width: 100%; max-width: 400px; padding: 32px; }
  </style>
</head>
<body>

  <div class="card login-card">
    <h2 style="text-align: center; margin-bottom: 24px;">HBntory Connexion</h2>
    
    <form id="login-form">
      <div class="form-group">
        <label for="username">Identifiant</label>
        <input type="text" id="username" placeholder="admin ou employe" required>
      </div>
      
      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn" style="width: 100%; margin-top: 16px;">Se connecter</button>
    </form>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      const formData = new URLSearchParams();
      formData.append('username', username);
      formData.append('password', password);

      try {
        const res = await fetch('http://127.0.0.1:8000/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: formData
        });

        if (res.ok) {
          const data = await res.json();
          localStorage.setItem('userToken', data.access_token);

          // Redirection selon le rôle porté par le jeton, et non selon le nom
          // saisi : un compte administrateur nommé autrement arrive quand même
          // sur le bon écran. Le serveur revérifie les droits à chaque requête.
          const role = JSON.parse(atob(data.access_token.split('.')[1])).role;

          if (role === 'admin') {
            localStorage.setItem('adminToken', data.access_token);
            window.location.href = 'admin.html';
          } else {
            window.location.href = 'employee.html';
          }
        } else {
          alert("Identifiant ou mot de passe incorrect.");
        }
      } catch (err) {
        alert("Erreur de connexion au serveur.");
      }
    });
  </script>
</body>
</html>
